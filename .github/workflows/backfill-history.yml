name: backfill-history

# Collects the full history: ESPN's past cards (results, bout order, records, photo ids),
# then every bout's fight stats and every sportsbook's opening and closing lines from
# ESPN's core API. A full first pass takes several runs; each run picks up where the last
# one stopped and saves its progress, so it runs every weekday morning until it has
# everything, then just adds the latest cards. Start it any time from
# Actions -> backfill-history -> Run workflow, or by editing .github/backfill-request.txt.
# (UFCStats now shows automated visitors a browser check, so it's no longer used.)
on:
  schedule:
    - cron: "23 7 * * 1-5"     # weekday mornings (UTC), away from fight nights
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend on fight stats and lines"
        default: "270"
  push:
    paths: [".github/backfill-request.txt"]

concurrency:
  group: backfill-history
  cancel-in-progress: true    # safe: every run resumes where the last one stopped

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p data/logs

      - name: ESPN past cards (up to 30 minutes)
        continue-on-error: true
        run: timeout 30m python src/espn.py --history 2>&1 | tee data/logs/espn_history.log | tail -n 100

      - name: Save progress
        run: 'bash .github/save.sh "Backfill: ESPN past cards"'

      - name: ESPN fight stats and lines (up to 4.5 hours)
        continue-on-error: true
        run: python src/espn_backfill.py ${{ inputs.minutes || '270' }} 2>&1 | tee data/logs/espn_backfill.log | tail -n 100

      - name: Save progress
        run: 'bash .github/save.sh "Backfill: ESPN fight stats and lines"'

      - name: Grappling numbers for active fighters (UFC.com, up to 45 minutes)
        continue-on-error: true
        run: timeout 50m python src/ufc_athletes.py 45 2>&1 | tee data/logs/ufc_athletes.log | tail -n 20

      - name: Use the latest code (a long run may have started before a fix was pushed)
        run: git fetch -q origin main && git checkout origin/main -- src

      - name: Fighter countries for the flags (ESPN, then UFC.com birthplace)
        continue-on-error: true
        run: timeout 20m python src/countries.py 15 2>&1 | tail -n 5

      - name: Freely licensed fighter photos (Wikidata / Wikimedia Commons)
        continue-on-error: true
        run: timeout 15m python src/photos.py 2>&1 | tail -n 5

      - name: Convert, rebuild, backtest, predict
        run: |
          python src/import_espn_stats.py || echo "stats not converted yet"
          python src/get_data.py --offline
          python src/backtest.py
          python src/predict.py
          python src/expert_analysis.py || true
          python src/expert_model.py || true
          python src/site_data.py

      - name: Save
        if: always()
        run: 'bash .github/save.sh "Backfill: rebuild and backtest"'
