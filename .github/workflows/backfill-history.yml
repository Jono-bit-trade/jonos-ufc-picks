name: backfill-history

# Collects the full history: every UFC fight's stats from UFCStats, every fighter's
# opening and closing lines from BestFightOdds, and ESPN's past cards. A full first
# pass takes several runs; each run picks up where the last one stopped and saves
# its progress, so it runs every weekday morning until it has everything, then just
# adds the latest cards. Start it any time from Actions -> backfill-history -> Run workflow.
on:
  schedule:
    - cron: "0 7 * * 1-5"     # weekday mornings (UTC), away from fight nights
  workflow_dispatch:

concurrency:
  group: fight-week
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install "ufcscraper @ git+https://github.com/balaustrada/ufcscraper@0a3d800a18d4a7946f12135e35606da467ffcb9f"

      - name: UFCStats fights, fighters and round stats (up to 2 hours)
        continue-on-error: true
        run: timeout 120m ufcscraper_scrape_ufcstats_data --data-folder data/ufcscraper --n-sessions 4 --delay 1 --log-level WARNING

      - name: Save progress
        run: bash .github/save.sh "Backfill: UFCStats history"

      - name: BestFightOdds opening and closing lines (up to 2.5 hours)
        continue-on-error: true
        run: timeout 150m xvfb-run -a ufcscraper_scrape_bestfightodds_data --data-folder data/ufcscraper --n-sessions 2 --delay 1 --min-date 2010-01-01 --log-level WARNING

      - name: Save progress
        run: bash .github/save.sh "Backfill: BestFightOdds lines"

      - name: ESPN past cards (up to 30 minutes)
        continue-on-error: true
        run: timeout 30m python src/espn.py --history

      - name: Convert, rebuild, backtest, predict
        run: |
          python src/import_history.py
          python src/get_data.py --offline
          python src/backtest.py
          python src/predict.py

      - name: Save
        if: always()
        run: bash .github/save.sh "Backfill: rebuild and backtest"
