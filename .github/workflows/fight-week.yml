name: fight-week

on:
  schedule:
    # Times are UTC; Central is 5 hours behind until early November, then 6.
    - cron: "0 4 * * 2"             # Monday night: weekend results, UFCStats stats, rebuild, backtest
    - cron: "0 14 * * *"            # every morning: next card, lines (line-movement history), picks
    - cron: "0 23 * * 3,4,5"        # Wed-Fri evenings: extra line snapshots (Friday's is after weigh-ins)
    - cron: "0 17,20 * * 6"         # Saturday midday and afternoon: last lines before the prelims
    - cron: "*/20 21-23 * * 6"      # Saturday night: live status and results every 20 minutes
    - cron: "*/20 0-6 * * 0"        #   (continues past midnight UTC)
  workflow_dispatch:                # adds a "Run workflow" button on the Actions tab
  push:
    paths: ["data/name_map.csv", "src/**", ".github/workflows/fight-week.yml"]   # a fix or a code change: refresh the board

concurrency:
  group: fight-week
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Work out which run this is
        id: kind
        run: |
          case "${{ github.event.schedule }}" in
            "0 4 * * 2") echo "kind=full" >> "$GITHUB_OUTPUT" ;;
            "*/20 21-23 * * 6"|"*/20 0-6 * * 0") echo "kind=live" >> "$GITHUB_OUTPUT" ;;
            "") [ "${{ github.event_name }}" = "push" ] && echo "kind=lines" >> "$GITHUB_OUTPUT" || echo "kind=full" >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=lines" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Results and history (Monday night or a manual run)
        if: steps.kind.outputs.kind == 'full'
        continue-on-error: true
        run: |
          python src/get_data.py

      - name: ESPN live feed (card, status, results, ESPN lines)
        if: steps.kind.outputs.kind != 'predict'
        continue-on-error: true
        run: python src/espn.py

      - name: Expert picks (SplitPicks)
        if: steps.kind.outputs.kind != 'live'
        continue-on-error: true
        run: |
          python src/splitpicks.py
          python src/names.py

      - name: Betting lines (The Odds API)
        if: steps.kind.outputs.kind == 'full' || steps.kind.outputs.kind == 'lines'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/get_odds.py


      - name: Grappling numbers (UFC.com athlete pages, 15 seconds apart)
        if: steps.kind.outputs.kind != 'live'
        continue-on-error: true
        run: timeout 12m python src/ufc_athletes.py 8

      - name: Use the latest code (a long run may have started before a fix was pushed)
        run: git fetch -q origin main && git checkout origin/main -- src

      - name: Rebuild the fight history
        run: python src/get_data.py --offline

      - name: Backtest
        if: steps.kind.outputs.kind == 'full'
        run: |
          python src/backtest.py
          python src/edges.py

      - name: Predict
        run: python src/predict.py

      - name: Fighter profiles, past cards and the expert test
        run: |
          python src/expert_analysis.py || echo "no expert picks yet"
          python src/expert_model.py || echo "not enough expert picks yet"
          python src/site_data.py

      - name: Save
        if: always()
        run: bash .github/save.sh "Update ${{ steps.kind.outputs.kind }}"
