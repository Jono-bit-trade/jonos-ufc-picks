<!doctype html><html><head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0f1013;font-family:"Barlow",sans-serif;overflow:hidden;color:#f3f1ea}
.bg{position:absolute;inset:0;background:radial-gradient(60% 90% at 78% 40%,rgba(217,169,26,.14),transparent 70%),#0f1013}
.cage{position:absolute;right:-120px;top:-60px;width:900px;height:760px;background:url(CAGE) center/contain no-repeat;opacity:.9}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:#d9a91a}
.wrap{position:absolute;left:78px;top:60px;right:70px;bottom:56px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:70px;height:70px}
.w1{font:700 21px/1 "Big Shoulders Display";color:#d9a91a;letter-spacing:.22em}
.w2{font:900 55px/.9 "Big Shoulders Display";letter-spacing:.02em}
h1{margin:44px 0 0;font:900 88px/.92 "Big Shoulders Display";text-transform:uppercase;letter-spacing:.005em;max-width:820px}
h1 em{font-style:normal;color:#d9a91a}
p{margin:20px 0 0;font:500 26px/1.35 "Barlow";color:#b9bcc4;max-width:820px}
.stats{margin-top:auto;display:flex;border:1px solid #2b2d33;border-radius:14px;overflow:hidden;width:max-content;background:rgba(20,21,25,.88)}
.st{padding:15px 26px;border-right:1px solid #2b2d33}.st:last-child{border-right:0}
.st b{display:block;font:800 44px/1 "Big Shoulders Display"}.st b.g{color:#3dbe6c}.st b.r{color:#e5484d}
.st span{font:500 17px "Barlow";color:#9a9ea8}
.k{position:absolute;right:70px;bottom:62px;font:700 18px "Barlow";letter-spacing:.14em;text-transform:uppercase;color:#d9a91a}
</style></head><body><div class="bg"></div><div class="cage"></div><div class="bar"></div>
<div class="wrap">
<div class="brand"><svg viewBox="0 0 48 48"><polygon points="14,2 34,2 46,14 46,34 34,46 14,46 2,34 2,14" fill="#d9a91a"/><polygon points="16,7 32,7 41,16 41,32 32,41 16,41 7,32 7,16" fill="#0f1013"/><path d="M14 30 L24 17 L34 30" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="square"/><path d="M19 34 H29" fill="none" stroke="#d9a91a" stroke-width="3.5"/></svg>
<div><div class="w1">OCTAGON</div><div class="w2">EDGE</div></div></div>
<h1>Beat the sportsbook, <em>not just the fight.</em></h1>
<p>UFC picks posted before every fight and graded after it, win or lose.</p>
<div class="stats">
<div class="st"><b>{{PCT}}%</b><span>of our picks won</span></div>
<div class="st"><b class="g">{{UNITS}}</b><span>our picks since {{FROM}}, flat 1u</span></div>
<div class="st"><b class="r">{{FAV}}</b><span>betting every favorite</span></div>
</div>
</div><div class="k">Fight picks · Odds · Analysis</div>
</body></html>
